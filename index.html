        body {
            font-family: 'Inter', sans-serif;
            background-color: #090D16;

        /* Ambient Glow Highlights */
        .glow-cyan {
            box-shadow: 0 0 25px -5px rgba(0, 240, 255, 0.3);
        }
        .glow-orange {
            box-shadow: 0 0 25px -5px rgba(255, 85, 0, 0.3);
        }
        .text-gradient {
            background: linear-gradient(135deg, #00F0FF 0%, #FF5500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Reading Progress Bar */
        #readingProgress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(to right, #00F0FF, #FF5500);
            z-index: 100;
            width: 0%;
            transition: width 0.1s ease-out;
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090D16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1F2937;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00F0FF;
        }

        .glass-panel {
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(17, 24, 39, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: rgba(0, 240, 255, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px -10px rgba(0, 240, 255, 0.15);
        }
    </style>
</head>
